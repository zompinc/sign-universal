name: build

on:
  push:
    branches: [master]
  pull_request:
  # Releases are cut by hand from master. The tag is derived from the package rather
  # than typed, so the two cannot disagree.
  workflow_dispatch:

# Declared null so the Actions schema linter accepts the `env.ACT` references below.
# nektos/act sets it, so steps that only make sense on a hosted runner can opt out.
env:
  ACT:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          # Nerdbank.GitVersioning derives the version from git height, so a shallow
          # clone produces the wrong version - or no build at all.
          fetch-depth: 0

      - name: Install .NET
        # Under act, Windows jobs run directly on the host where the SDK already lives;
        # the Linux container has no dotnet at all, so it still needs this.
        if: ${{ !env.ACT || runner.os != 'Windows' }}
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Self-test
        run: dotnet run --project src/SignUniversal.Cli -c Release -- self-test

      - name: Locate the NuGet cache
        # A directory of signed binaries for the digest oracle to check us against. It has
        # to be a native path: bash on Windows reports $HOME as /c/Users/..., which .NET
        # cannot resolve, so the check skipped there while looking green.
        shell: pwsh
        run: |
          $cache = Join-Path $HOME ".nuget/packages"
          "SIGNUNIVERSAL_PE_CORPUS=$cache" >> $env:GITHUB_ENV

      - name: Build an MSI fixture
        # WiX ships on the Windows images, so the MSI gate needs no committed binary and
        # no download. Only this leg can run signtool anyway.
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $wix = Join-Path $env:WIX "bin"
          & "$wix\candle.exe" test\fixtures\sample.wxs -out "$env:RUNNER_TEMP\sample.wixobj"
          if ($LASTEXITCODE -ne 0) { throw "candle failed" }
          & "$wix\light.exe" "$env:RUNNER_TEMP\sample.wixobj" -out "$env:RUNNER_TEMP\sample.msi"
          if ($LASTEXITCODE -ne 0) { throw "light failed" }
          "SIGNUNIVERSAL_MSI_FIXTURE=$env:RUNNER_TEMP\sample.msi" >> $env:GITHUB_ENV

      - name: Sign the MSI fixture with signtool
        # Ground truth on every build, not a one-off diagnostic: signtool's signature over
        # this package carries the digest and pre-hash Windows expects, and the oracle
        # tests below check ours against them.
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: |
          $tool = (Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin/*/x64/signtool.exe" |
                   Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject "CN=sign-universal signtool oracle" `
            -CertStoreLocation Cert:\CurrentUser\My -KeyAlgorithm RSA -KeyLength 2048
          Copy-Item "$env:RUNNER_TEMP/sample.msi" "$env:RUNNER_TEMP/signtool-signed.msi"
          & $tool sign /fd SHA256 /sha1 $cert.Thumbprint "$env:RUNNER_TEMP/signtool-signed.msi"
          if ($LASTEXITCODE -ne 0) { throw "signtool sign failed" }
          "SIGNUNIVERSAL_MSI_ORACLE=$env:RUNNER_TEMP/signtool-signed.msi" >> $env:GITHUB_ENV

      - name: Test
        env:
          # The signtool gate is the only check that can decide whether our Authenticode
          # output is really valid, and it exists only here. Requiring it means the
          # Windows leg fails if signtool is missing, rather than skipping the gate and
          # going green - which would be worse than having no gate at all.
          SIGNUNIVERSAL_REQUIRE_SIGNTOOL: ${{ runner.os == 'Windows' && '1' || '' }}
          # Runners have network, so the timestamp authority is reachable. Locally these
          # tests skip visibly rather than making every run depend on someone's uptime.
          SIGNUNIVERSAL_TIMESTAMP_TESTS: '1'
        run: dotnet run --project test/SignUniversal.Core.Tests -c Release

      - name: Keep the MSI packages for diagnosis
        # A signature Windows rejects is only debuggable with the files in hand.
        if: ${{ failure() && runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: msi-diagnosis
          path: |
            ${{ runner.temp }}/sample.msi
            ${{ runner.temp }}/signtool-signed.msi
          retention-days: 5
          if-no-files-found: ignore

  pack:
    name: pack
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET
        # Under act, Windows jobs run directly on the host where the SDK already lives;
        # the Linux container has no dotnet at all, so it still needs this.
        if: ${{ !env.ACT || runner.os != 'Windows' }}
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack
        # The whole solution: the tool plus the three libraries. Test projects set
        # IsPackable=false, so this produces exactly the shipping set.
        run: dotnet pack -c Release -o artifacts

      - name: Install the packed tool
        run: |
          dotnet tool install --global --add-source artifacts --prerelease SignUniversal.Cli
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Smoke-test the installed tool
        # Installing is not the same as working: this catches a tool that cannot start on
        # the runner's runtime, and proves the shipped package can actually sign.
        run: |
          sign-universal --version
          sign-universal self-test
          cp artifacts/*.nupkg smoke.nupkg
          sign-universal sign smoke.nupkg --self-signed --no-timestamp
          dotnet nuget verify smoke.nupkg > verify.txt 2>&1 || true
          cat verify.txt
          grep -q "Signature type: Author" verify.txt

      - name: Upload artifacts (.nupkg)
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/
          retention-days: 5

  publish:
    name: publish
    needs: pack
    # Deliberate, from master, and never from a fork - which could not reach the signing
    # credentials anyway.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && github.repository == 'zompinc/sign-universal' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the tag and the GitHub Release

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts

      - name: Install .NET
        # Under act, Windows jobs run directly on the host where the SDK already lives;
        # the Linux container has no dotnet at all, so it still needs this.
        if: ${{ !env.ACT || runner.os != 'Windows' }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Require credentials
        # Fail before anything is published rather than quietly shipping an unsigned
        # release because a secret was renamed or scoped away from this repository.
        env:
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNER_CLIENT_SECRET }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          NUGET_PUSH_KEY: ${{ secrets.NUGET_PUSH_KEY }}
        run: |
          missing=
          [ -n "$AZURE_CLIENT_SECRET" ] || missing="$missing AZURE_SIGNER_CLIENT_SECRET"
          [ -n "$TRUSTED_SIGNING_ENDPOINT" ] || missing="$missing TRUSTED_SIGNING_ENDPOINT"
          [ -n "$NUGET_PUSH_KEY" ] || missing="$missing NUGET_PUSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Refusing to publish. Missing secrets:$missing"
            echo "These are organization-level secrets; check they are visible to this repository."
            exit 1
          fi

      - name: Install the release that is about to be published
        run: |
          dotnet tool install --global --add-source artifacts --prerelease SignUniversal.Cli
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Sign the release with itself
        # Dogfooding on purpose: the build being released is the thing that signs it, so a
        # regression in signing breaks the release loudly instead of shipping quietly
        # broken signatures to everyone who installs the tool. On Linux, which is the
        # point of the project - no Windows job in this pipeline.
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_SIGNER_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNER_CLIENT_SECRET }}
        run: |
          shopt -s nullglob
          packages=(artifacts/*.nupkg artifacts/*.snupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No packages to sign."
            exit 1
          fi
          sign-universal sign "${packages[@]}" --trust-signing-root \
            --trusted-signing-endpoint "${{ secrets.TRUSTED_SIGNING_ENDPOINT }}" \
            --trusted-signing-account "${{ secrets.TRUSTED_SIGNING_ACCOUNT }}" \
            --trusted-signing-certificate-profile "${{ secrets.TRUSTED_SIGNING_CERTIFICATE_PROFILE }}"

      - name: Verify the signature before publishing
        # A real Trusted Signing certificate chains to a root in NuGet's own bundle, so
        # this must pass outright. Anything less means we are about to publish something
        # nobody else will be able to validate either.
        run: |
          shopt -s nullglob
          for package in artifacts/*.nupkg artifacts/*.snupkg; do
            echo "::group::verify $package"
            dotnet nuget verify "$package" --all
            echo "::endgroup::"
          done

      - name: Push to nuget.org
        env:
          NUGET_PUSH_KEY: ${{ secrets.NUGET_PUSH_KEY }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "$NUGET_PUSH_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create the GitHub Release
        # The tag comes from the package that was actually built. Nerdbank.GitVersioning
        # derives the version from version.json and git height, so a hand-typed tag can
        # claim a version the package does not have; deriving it the other way round makes
        # that impossible.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }} # gh infers the repo from this, with no checkout
        run: |
          package=$(ls artifacts/SignUniversal.*.nupkg | head -1)
          version=$(basename "$package")
          version=${version#SignUniversal.}
          version=${version%.nupkg}
          gh release create "v$version" \
            --target "$GITHUB_SHA" \
            --title "v$version" \
            --generate-notes \
            artifacts/*.nupkg
